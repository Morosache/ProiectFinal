workflows:
  ios-workflow:
    name: MoneyTrack iOS
    max_build_duration: 60
    environment:
      node: 22
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: |
          cd app
          yarn install
      - name: Build web app
        script: |
          cd app
          yarn build
      - name: Add and sync Capacitor iOS
        script: |
          cd app
          rm -rf ios
          yarn cap add ios
          yarn cap sync ios
      - name: Install CocoaPods
        script: |
          cd app/ios/App
          pod install
      - name: Build iOS
        script: |
          cd app/ios/App
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO
    artifacts:
      - app/ios/App/DerivedData/**/*.app

  android-workflow:
    name: MoneyTrack Android
    max_build_duration: 60
    environment:
      node: 22
      java: 21
    scripts:
      - name: Install dependencies
        script: |
          cd app
          yarn install
      - name: Build web app
        script: |
          cd app
          yarn build
      - name: Sync Capacitor Android
        script: |
          cd app
          yarn cap sync android
      - name: Build Android APK
        script: |
          cd app/android
          ./gradlew assembleDebug
    artifacts:
      - app/android/app/build/outputs/apk/debug/app-debug.apk
