workflows:
  ios-workflow:
    name: MoneyTrack iOS
    max_build_duration: 60
    environment:
      node: 22
      xcode: latest
    scripts:
      - name: Install JS dependencies
        script: |
          cd app
          yarn install
      - name: Build web app
        script: |
          cd app
          yarn build
      - name: Generate iOS project, sync and build
        script: |
          set -e
          cd app
          echo "--- Removing old ios folder ---"
          rm -rf ios
          echo "--- Adding Capacitor iOS platform ---"
          yarn cap add ios
          echo "--- Syncing web assets ---"
          yarn cap sync ios
          echo "--- Building with Xcode (SPM resolves dependencies automatically) ---"
          cd ios/App
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO
    artifacts:
      - app/ios/App/DerivedData/**/*.app

  android-workflow:
    name: MoneyTrack Android
    max_build_duration: 60
    environment:
      node: 22
      java: 21
    scripts:
      - name: Install dependencies
        script: |
          cd app
          yarn install
      - name: Build web app
        script: |
          cd app
          yarn build
      - name: Sync Capacitor Android
        script: |
          cd app
          yarn cap sync android
      - name: Build Android APK
        script: |
          cd app/android
          ./gradlew assembleDebug
    artifacts:
      - app/android/app/build/outputs/apk/debug/app-debug.apk
